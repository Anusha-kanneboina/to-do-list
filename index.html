<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          type="text/css"
          href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>To-Do List App</title>

</head>

<body>

    <!-- ================= MAIN CONTAINER ================= -->

    <div class="container">

        <!-- ================= HEADER ================= -->

        <div class="app-header">

            <h1>
                <i class="fa-solid fa-list-check"></i>
                To-Do List
            </h1>

            <p>
                Organize your tasks and stay productive.
            </p>

        </div>


        <!-- ================= INPUT SECTION ================= -->

        <div class="input-section">

            <!-- Task Input -->

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task">


            <!-- Priority -->

            <select id="priorityInput">

                <option value="Low">
                    Low Priority
                </option>

                <option value="Medium" selected>
                    Medium Priority
                </option>

                <option value="High">
                    High Priority
                </option>

            </select>


            <!-- Due Date -->

            <input
                type="date"
                id="dueDateInput">


            <!-- Buttons -->

            <div class="action-buttons">

                <button
                    type="button"
                    onclick="addTask()">

                    <i class="fa-solid fa-plus"></i>
                    Add

                </button>


                <button
                    type="button"
                    onclick="clearAll()">

                    <i class="fa-solid fa-trash-can"></i>
                    Clear All

                </button>


                <button
                    type="button"
                    id="themeBtn"
                    title="Toggle Dark Mode">

                    🌙

                </button>

            </div>

        </div>


        <!-- ================= SEARCH ================= -->

        <div class="search-section">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks...">

            </div>

        </div>


        <!-- ================= FILTER BUTTONS ================= -->

        <div class="filter-section">

            <button
                class="filter-btn active"
                onclick="filterTasks('all')">

                All

            </button>


            <button
                class="filter-btn"
                onclick="filterTasks('pending')">

                Pending

            </button>


            <button
                class="filter-btn"
                onclick="filterTasks('completed')">

                Completed

            </button>

        </div>


        <!-- ================= TASK LIST ================= -->

        <ul id="taskList">

        </ul>


        <!-- ================= DELETE SELECTED ================= -->

        <button
            id="deleteSelectedBtn"
            onclick="deleteSelected()"
            style="display:none;">

            <i class="fa-solid fa-trash"></i>
            Delete Selected

        </button>

    </div>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
